<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login & Sign Up</title>

  <!-- Flask static CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% with messages = get_flashed_messages() %}
  {% if messages %}
    <div class="flash-container">
      {% for message in messages %}
        <div class="flash-message">
          {{ message }}
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}


<div class="wrapper active" id="formWrapper">
  
  <!-- Signup Form (FIRST) -->
  <div class="form-container signin">
    <h2>Sign Up</h2>
    <form method="POST" action="/signup">

      <input type="text" name="username" placeholder="Username" required />
      <input type="email" name="email" placeholder="Email" required />
      <input type="password" name="password" placeholder="Password" required />
      <input type="password" name="confirm_password" placeholder="Confirm Password" required />

      <label class="accept-terms">
        <input type="checkbox" required /> I accept the terms & conditions
      </label>

      <button type="submit" class="submit-btn">Sign Up</button>
    </form>
  </div>

  <!-- Login Form (SECOND) -->
  <div class="form-container login">
    <h2>Login</h2>
    <form method="POST" action="/login">

    <div class="roles">
        <button type="button" class="active" onclick="setRole('student', this)">Student</button>
        <button type="button" onclick="setRole('admin', this)">Admin</button>
        <button type="button" onclick="setRole('driver', this)">Driver</button>
    </div>

    <input type="hidden" name="role" id="roleInput" value="student">

    <input type="text" name="login_user" placeholder="Username or Email" required>
    <input type="password" name="login_password" placeholder="Password" required>

    <button type="submit" class="submit-btn">LOGIN</button>

</form>

  </div>

  <!-- Toggle Panel -->
  <div class="toggle-container">
    <h2 id="toggleHeading">Already have an account?</h2>
    <p id="toggleText">Login to your account!</p>
    <button class="switch-btn" id="toggleBtn">Login</button>
  </div>

</div>

<script>
  const wrapper = document.getElementById('formWrapper');
  const toggleBtn = document.getElementById('toggleBtn');
  const toggleHeading = document.getElementById('toggleHeading');
  const toggleText = document.getElementById('toggleText');

  toggleBtn.addEventListener('click', () => {
    wrapper.classList.toggle('active');

    if(wrapper.classList.contains('active')){
      toggleHeading.textContent = "Already have an account?";
      toggleText.textContent = "Login to your account!";
      toggleBtn.textContent = "Login";
    } else {
      toggleHeading.textContent = "Don't have an account?";
      toggleText.textContent = "Sign up to get started!";
      toggleBtn.textContent = "Sign Up";
    }
  });
</script>

<script>
function setRole(role, btn) {
    document.getElementById("roleInput").value = role;
    document.querySelectorAll(".roles button")
        .forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
}
</script>

</body>
</html>
