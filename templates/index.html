<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login & Sign Up</title>

  <!-- Flask static CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

{% with messages = get_flashed_messages() %}
{% if messages %}
  <div class="flash-container">
    {% for message in messages %}
      <div class="flash-message">{{ message }}</div>
    {% endfor %}
  </div>
{% endif %}
{% endwith %}

<!-- =============================
     WRAPPER
============================= -->
<div class="wrapper" id="formWrapper">

  <!-- =============================
       SIGN UP FORM
  ============================= -->
  <div class="form-container signin">
    <h2>Sign Up</h2>

    <form method="POST" action="/signup">
     <!-- Roll Number -->
<input
  type="text"
  name="username"
  placeholder="Enter your roll number"
  required
/>

<!-- Email -->
<input
  type="email"
  name="email"
  placeholder="Enter your correct email address"
  required
/>

<!-- Password -->
<input
  type="password"
  name="password"
  placeholder="Password (minimum 6 characters)"
  required
/>

<!-- Confirm Password -->
<input
  type="password"
  name="confirm_password"
  placeholder="Re-enter the same password"
  required
/>


      <label class="accept-terms">
        <input type="checkbox" required />
        I accept the terms & conditions
      </label>

      <button type="submit" class="submit-btn">Sign Up</button>
    </form>

    <!-- Mobile switch -->
    <p class="mobile-switch">
      Already have an account?
      <a href="#" onclick="showLogin()">Login</a>
    </p>
  </div>

  <!-- =============================
       LOGIN FORM
  ============================= -->
  <div class="form-container login">
    <h2>Login</h2>

    <form method="POST" action="/login">

      <div class="roles">
        <button type="button" class="active" onclick="setRole('student', this)">Student</button>
        <button type="button" onclick="setRole('admin', this)">Admin</button>
        <button type="button" onclick="setRole('driver', this)">Driver</button>
      </div>

      <input type="hidden" name="role" id="roleInput" value="student">

      <input type="text" name="login_user" placeholder="Roll no or Email" required />
      <input type="password" name="login_password" placeholder="Password" required />

      <button type="submit" class="submit-btn">LOGIN</button>
    </form>

    <!-- Mobile switch -->
    <p class="mobile-switch">
      New user?
      <a href="#" onclick="showSignup()">Sign up</a>
    </p>
  </div>

  <!-- =============================
       DESKTOP TOGGLE PANEL
  ============================= -->
  <div class="toggle-container">
    <h2 id="toggleHeading">Already have an account?</h2>
    <p id="toggleText">Login to your account!</p>
    <button class="switch-btn" id="toggleBtn">Login</button>
  </div>

</div>

<!-- =============================
     DESKTOP TOGGLE SCRIPT
============================= -->
<script>
  const wrapper = document.getElementById('formWrapper');
  const toggleBtn = document.getElementById('toggleBtn');
  const toggleHeading = document.getElementById('toggleHeading');
  const toggleText = document.getElementById('toggleText');

  toggleBtn.addEventListener('click', () => {
    wrapper.classList.toggle('active');

    if (wrapper.classList.contains('active')) {
      toggleHeading.textContent = "Already have an account?";
      toggleText.textContent = "Login to your account!";
      toggleBtn.textContent = "Login";
    } else {
      toggleHeading.textContent = "Don't have an account?";
      toggleText.textContent = "Sign up to get started!";
      toggleBtn.textContent = "Sign Up";
    }
  });
</script>

<!-- =============================
     ROLE SELECT SCRIPT
============================= -->
<script>
function setRole(role, btn) {
  document.getElementById("roleInput").value = role;
  document.querySelectorAll(".roles button")
    .forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
}
</script>

<!-- =============================
     MOBILE BEHAVIOR SCRIPT
============================= -->
<script>
function showSignup() {
  wrapper.classList.add("mobile-signup");
}

function showLogin() {
  wrapper.classList.remove("mobile-signup");
}
</script>
<footer style="
    position:fixed;
    bottom:0;
    width:100%;
    text-align:center;
    padding:8px;
    font-size:13px;
    color:#94a3b8;
    background:#020617;
">
    Designed by <b>MANIKANTA & TEAM 7</b>
</footer>
<script>
const password = document.querySelector('input[name="password"]');
const confirmPassword = document.querySelector('input[name="confirm_password"]');
const signupForm = document.querySelector('form[action="/signup"]');

function validatePasswords() {
  // 🔄 RESET STATE FIRST (THIS WAS MISSING)
  password.classList.remove("error", "success");
  confirmPassword.classList.remove("error", "success");

  // empty → neutral
  if (!password.value || !confirmPassword.value) {
    return;
  }

  // rule 1: length
  if (password.value.length < 6) {
    password.classList.add("error");
    return;
  }

  // rule 2: match
  if (password.value !== confirmPassword.value) {
    password.classList.add("error");
    confirmPassword.classList.add("error");
    return;
  }

  // ✅ valid
  password.classList.add("success");
  confirmPassword.classList.add("success");
}

password.addEventListener("input", validatePasswords);
confirmPassword.addEventListener("input", validatePasswords);

signupForm.addEventListener("submit", function (e) {
  validatePasswords();

  const isInvalid =
    password.classList.contains("error") ||
    confirmPassword.classList.contains("error") ||
    password.value.length < 6 ||
    password.value !== confirmPassword.value;

  if (isInvalid) {
    e.preventDefault();
    alert("Fix password errors");
  }
});
</script>




</body>
</html>
