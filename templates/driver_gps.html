<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="{{ url_for('static', filename='menu.css') }}?v=99">

    <meta charset="UTF-8">
    <title>Driver Live GPS</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    


    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #0b1c2d;
            color: white;
            font-family: Arial, sans-serif;
        }
        #info {
            margin-bottom: 10px;
            font-size: 16px;
        }
        button {
            padding: 8px 14px;
            margin-right: 10px;
            cursor: pointer;
        }
        #map {
    width: 100%;
    height: 55vh;
    min-height: 320px;
    max-height: 420px;

    border-radius: 14px;
    border: 2px solid #1e293b;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.05);

    margin-top: 12px;
    overflow: hidden;
}

/* Mobile fix */
@media (max-width: 768px) {
    #map {
        height: 300px;
        min-height: unset;
    }
}

    </style>
</head>

<body>
{% include "navbar.html" %}

<div class="page-content">

    <h2>🚍 Driver Live GPS</h2>

    <div class="driver-controls">
    <button onclick="startTracking()" class="control-btn start-btn">
        ▶ Start Sharing Location
    </button>

    <button onclick="stopTracking()" class="control-btn stop-btn">
        ■ Stop
    </button>
</div>


    <!-- MAP (ONLY ONE) -->
    <div id="map"></div>

    <!-- DRIVER STATS -->
    <div class="driver-stats">
        <div class="driver-stat-card driver-stat-speed">
            🚗 Speed<br>
            <b><span id="driverSpeed">0</span> km/h</b>
        </div>

        <div class="driver-stat-card driver-stat-distance">
            📏 Distance<br>
            <b><span id="driverDistance">--</span></b>
        </div>

        <div class="driver-stat-card driver-stat-eta">
            ⏱ ETA<br>
            <b><span id="driverETA">--</span> </b>
        </div>
    </div>

    <!-- PICKUP PANEL (MOVED INSIDE) -->
    <div id="pickup-panel">
        <h3>📦 Pickup Order</h3>
        <ul id="pickupList" style="list-style:none;padding:0;"></ul>
    </div>

    <!-- SOS BUTTON (MOVED INSIDE) -->
    <button onclick="sendSOS()" class="sos-btn">
        🚨 SOS
    </button>

</div>




<script>
    let distanceTimer = null;

/* ================= AUTO UPDATE ================= */
setInterval(loadPickups, 5000);

/* ================= MAP ================= */
let map = L.map("map").setView([17.385, 78.4867], 14);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19
}).addTo(map);

/* ================= ICONS ================= */
const pickupIcon = L.icon({
    iconUrl: "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-blue.png",
    shadowUrl: "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png",
    iconSize: [25, 41],
    iconAnchor: [12, 41]
});

const tempPickupIcon = L.icon({
    iconUrl: "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-yellow.png",
    shadowUrl: "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png",
    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34]
});
const busIcon = L.icon({
    iconUrl: "https://cdn-icons-png.flaticon.com/512/3448/3448339.png",
    iconSize: [42, 42],
    iconAnchor: [21, 21]
});
const destinationIcon = L.icon({
    iconUrl: "https://cdn-icons-png.flaticon.com/512/684/684908.png",
    iconSize: [38, 38],
    iconAnchor: [19, 38],
    popupAnchor: [0, -35]
});
const tempStudentIcon = L.icon({
    iconUrl: "https://cdn-icons-png.flaticon.com/512/854/854878.png",
    iconSize: [36, 36],
    iconAnchor: [18, 36],
    popupAnchor: [0, -32]
});





/* ================= MARKERS ================= */
let driverMarker = L.marker([17.385, 78.4867], { icon: busIcon }).addTo(map);
let pickupMarkers = [];

/* ================= STATE ================= */
let destinationLat = 17.089148;
let destinationLng = 82.06599;
let destinationMarker = L.marker(
    [destinationLat, destinationLng],
    { icon: destinationIcon }
)
.addTo(map)
.bindPopup("🏁 Destination");

let pickupsCache = [];
let tracking = false;
let watchId = null;
let mapCentered = false;

/* ================= ROUTE STATE ================= */
let fullRoute = [];
let completedRoute = [];
let remainingRoute = [];

let completedLine = null;
let remainingLine = null;

/* ================= PICKUPS ================= */
function clearPickupMarkers() {
    pickupMarkers.forEach(m => map.removeLayer(m));
    pickupMarkers = [];
}

function loadPickups() {
    fetch("/driver/ordered_pickups")
        .then(r => r.json())
        .then(points => {
            pickupsCache = points;
            clearPickupMarkers();

            points.forEach(p => {
                const lat = p.lat ?? p.latitude ?? p.pickup_lat;
                const lng = p.lng ?? p.longitude ?? p.pickup_lng;
                if (lat === undefined || lng === undefined) return;

                const iconToUse = p.is_temp ? tempStudentIcon : pickupIcon;


                const m = L.marker([lat, lng], { icon: iconToUse })
                    .addTo(map)
                    .bindPopup(
                        (p.is_temp ? "🟡 TEMP PICKUP: " : "📍 PICKUP: ") + p.name
                    );

                pickupMarkers.push(m);
            });
        });
}

/* ================= ROUTE LOAD (ONCE) ================= */
function loadRouteOnce(startLat, startLng) {
    const url =
        `https://router.project-osrm.org/route/v1/driving/` +
        `${startLng},${startLat};${destinationLng},${destinationLat}` +
        `?overview=full&geometries=geojson`;

    fetch(url)
        .then(r => r.json())
        .then(data => {
            fullRoute = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
            completedRoute = [];
            remainingRoute = [...fullRoute];

            if (completedLine) map.removeLayer(completedLine);
            if (remainingLine) map.removeLayer(remainingLine);

            completedLine = L.polyline([], {
                color: "#9ca3af",
                weight: 5
            }).addTo(map);

            remainingLine = L.polyline(remainingRoute, {
                color: "#2563eb",
                weight: 5
            }).addTo(map);
            updateDistanceAndETA(); 
        });
}
/* ================= DISTANCE & ETA ================= */
function updateDistanceAndETA() {
    if (remainingRoute.length < 2) return;

    // -------- Remaining distance calculation --------
    let distance = 0;
    for (let i = 1; i < remainingRoute.length; i++) {
        distance += map.distance(
            remainingRoute[i - 1],
            remainingRoute[i]
        );
    }

    const kmLeft = distance / 1000;
    document.getElementById("driverDistance").innerText =
        kmLeft.toFixed(2) + " km";

    // -------- Speed-based ETA calculation --------
    let speed = parseFloat(
        document.getElementById("driverSpeed").innerText
    );

    // fallback speed if GPS speed is 0 / invalid
    if (isNaN(speed) || speed < 10) {
        speed = 25; // safe average speed
    }

    const totalMinutes = Math.max(
        1,
        Math.ceil((kmLeft / speed) * 60)
    );

    // -------- ETA display rule --------
    let etaText;

    if (totalMinutes < 60) {
        etaText = totalMinutes + " min";
    } else {
        const hr = Math.floor(totalMinutes / 60);
        const min = totalMinutes % 60;

        if (min === 0) {
            etaText = hr + " hr";
        } else {
            etaText = hr + " hr " + min + " min";
        }
    }

    document.getElementById("driverETA").innerText = etaText;
}



function refreshDistanceEveryMinute() {
    if (!tracking) return;
    updateDistanceAndETA();
}





function updateRouteProgress(lat, lng) {
    if (remainingRoute.length === 0) return;

    // ---- GPS jitter protection ----
    if (!window.__lastBusPos) {
        window.__lastBusPos = [lat, lng];
        return;
    }

    const movedMeters = map.distance(window.__lastBusPos, [lat, lng]);
    if (movedMeters < 25) return;

    window.__lastBusPos = [lat, lng];
    // --------------------------------

    let nearestIndex = 0;
    let minDist = Infinity;

    const limit = Math.min(40, remainingRoute.length);

    for (let i = 0; i < limit; i++) {
        const d = map.distance([lat, lng], remainingRoute[i]);
        if (d < minDist) {
            minDist = d;
            nearestIndex = i;
        }
    }

    const passed = remainingRoute.slice(0, nearestIndex + 1);
    remainingRoute = remainingRoute.slice(nearestIndex + 1);
    completedRoute.push(...passed);

    completedLine.setLatLngs(completedRoute);
    remainingLine.setLatLngs(remainingRoute);

    updateDistanceAndETA();
}


/* ================= SPEED ================= */
let lastPos = null;
let lastTime = null;

function calculateSpeed(lat, lng) {
    if (!lastPos) {
        lastPos = { lat, lng };
        lastTime = Date.now();
        return 0;
    }

    const R = 6371;
    const dLat = (lat - lastPos.lat) * Math.PI / 180;
    const dLng = (lng - lastPos.lng) * Math.PI / 180;

    const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(lastPos.lat * Math.PI / 180) *
        Math.cos(lat * Math.PI / 180) *
        Math.sin(dLng / 2) ** 2;

    const dist = R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    const hours = (Date.now() - lastTime) / 3600000;

    lastPos = { lat, lng };
    lastTime = Date.now();

    return hours > 0 ? (dist / hours).toFixed(1) : 0;
}

/* ================= GPS ================= */
function startTracking() {
    if (tracking) return;
    tracking = true;

    loadPickups();

    // 🔁 start 1-minute distance refresh (only once)
    if (!distanceTimer) {
        distanceTimer = setInterval(refreshDistanceEveryMinute, 60000);
    }

    watchId = navigator.geolocation.watchPosition(
        pos => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;

            fetch("/driver/update_location", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ latitude: lat, longitude: lng })
            });

            driverMarker.setLatLng([lat, lng]);
            updateRouteProgress(lat, lng);

            if (!mapCentered) {
                map.setView([lat, lng], 16);
                loadRouteOnce(lat, lng);
                mapCentered = true;
            }

            document.getElementById("driverSpeed").innerText =
                calculateSpeed(lat, lng);
        },
        err => alert(err.message),
        { enableHighAccuracy: true }
    );
}


function stopTracking() {
    if (watchId) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
    }

    if (distanceTimer) {
        clearInterval(distanceTimer);
        distanceTimer = null;
    }

    tracking = false;
    alert("Tracking stopped");
}


</script>

<script>
function sendSOS() {

    if (!confirm("Send SOS alert to admin?")) return;

    if (!navigator.geolocation) {
        alert("GPS not supported");
        return;
    }

    navigator.geolocation.getCurrentPosition(
        pos => {
            fetch("/driver/sos", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    latitude: pos.coords.latitude,
                    longitude: pos.coords.longitude
                })
            })
            .then(r => r.json())
            .then(d => {
                if (d.status === "ok") {
                    alert("🚨 SOS sent successfully");
                } else {
                    alert("❌ SOS failed");
                }
            })
            .catch(() => alert("❌ Network error"));
        },
        () => alert("❌ GPS permission denied")
    );
}
</script>
<script>
function loadPickupOrder() {
    fetch("/driver/ordered_pickups")
        .then(r => r.json())
        .then(data => {

            const ul = document.getElementById("pickupList");
            if (!ul) return;

            ul.innerHTML = "";

            if (data.length === 0) {
                ul.innerHTML = `
                    <li style="color:#94a3b8;padding:10px;">
                        No pickups assigned yet
                    </li>
                `;
                return;
            }

            data.forEach(p => {

                let statusColor = "#facc15"; // Pending
                if (p.status === "Approaching") statusColor = "#38bdf8";
                if (p.status === "Reached") statusColor = "#22c55e";

                const isTemp = p.is_temp === true;
                const bgColor = isTemp ? "#422006" : "#020617";
                const borderColor = isTemp ? "#facc15" : statusColor;
                const tempBadge = isTemp
                    ? "<span style='color:#facc15;font-weight:bold;margin-left:6px;'>(TEMP)</span>"
                    : "";

                ul.innerHTML += `
                  <li style="
                    margin-bottom:10px;
                    padding:12px;
                    border-radius:10px;
                    background:${bgColor};
                    border-left:6px solid ${borderColor};
                  ">
                    <b>${p.name}${tempBadge}</b><br>
                    ${p.distance} m —
                    <span style="color:${statusColor};font-weight:bold;">
                      ${p.status}
                    </span>
                  </li>
                `;
            });
        })
        .catch(err => console.error("Pickup order error:", err));
}
loadPickupOrder();
setInterval(loadPickupOrder, 5000);


</script>







</body>
</html>
