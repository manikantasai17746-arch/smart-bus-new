<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="{{ url_for('static', filename='menu.css') }}?v=99">

    <meta charset="UTF-8">
    <title>Driver Live GPS</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    


    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #0b1c2d;
            color: white;
            font-family: Arial, sans-serif;
        }
        #info {
            margin-bottom: 10px;
            font-size: 16px;
        }
        button {
            padding: 8px 14px;
            margin-right: 10px;
            cursor: pointer;
        }
        #map {
    width: 100%;
    height: 55vh;
    min-height: 320px;
    max-height: 420px;

    border-radius: 14px;
    border: 2px solid #1e293b;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.05);

    margin-top: 12px;
    overflow: hidden;
}

/* Mobile fix */
@media (max-width: 768px) {
    #map {
        height: 300px;
        min-height: unset;
    }
}

    </style>
</head>

<body>
{% include "navbar.html" %}

<div class="page-content">

    <h2>🚍 Driver Live GPS</h2>

    <div class="driver-controls">
    <button onclick="startTracking()" class="control-btn start-btn">
        ▶ Start Sharing Location
    </button>

    <button onclick="stopTracking()" class="control-btn stop-btn">
        ■ Stop
    </button>
</div>


    <!-- MAP (ONLY ONE) -->
    <div id="map"></div>

    <!-- DRIVER STATS -->
    <div class="driver-stats">
        <div class="driver-stat-card driver-stat-speed">
            🚗 Speed<br>
            <b><span id="driverSpeed">0</span> km/h</b>
        </div>

        <div class="driver-stat-card driver-stat-distance">
            📏 Distance<br>
            <b><span id="driverDistance">--</span></b>
        </div>

        <div class="driver-stat-card driver-stat-eta">
            ⏱ ETA<br>
            <b><span id="driverETA">--</span> min</b>
        </div>
    </div>

    <!-- PICKUP PANEL (MOVED INSIDE) -->
    <div id="pickup-panel">
        <h3>📦 Pickup Order</h3>
        <ul id="pickupList" style="list-style:none;padding:0;"></ul>
    </div>

    <!-- SOS BUTTON (MOVED INSIDE) -->
    <button onclick="sendSOS()" class="sos-btn">
        🚨 SOS
    </button>

</div>




<script>
  

// AUTO UPDATE every 5 seconds
setInterval(loadPickups, 5000); // every 5 seconds


/* ================= MAP ================= */
let map = L.map("map").setView([17.385, 78.4867], 14);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19
}).addTo(map);

/* ================= ICONS ================= */
const pickupIcon = L.icon({
    iconUrl: "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-blue.png",
    shadowUrl: "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png",
    iconSize: [25, 41],
    iconAnchor: [12, 41]
});

/* ================= MARKERS ================= */
let driverMarker = L.marker([17.385, 78.4867]).addTo(map);
let pickupMarkers = [];
function clearPickupMarkers() {
    pickupMarkers.forEach(m => map.removeLayer(m));
    pickupMarkers = [];
}


/* ================= STATE ================= */
let destinationLat = 17.089148;
let destinationLng = 82.06599;

let routeControl = null;
let pickupsCache = [];
let tracking = false;
let watchId = null;
let mapCentered = false;

let lastRouteLat = null;
let lastRouteLng = null;

/* ================= LOAD PICKUPS (ONCE) ================= */
const tempPickupIcon = L.icon({
    iconUrl: "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-yellow.png",
    shadowUrl: "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png",
    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34]
});

function loadPickups() {
    fetch("/driver/ordered_pickups")
        .then(r => r.json())
        .then(points => {

            pickupsCache = points;
            clearPickupMarkers();

            points.forEach(p => {
                const iconToUse = p.is_temp ? tempPickupIcon : pickupIcon;

                const lat = p.lat ?? p.latitude ?? p.pickup_lat;
                const lng = p.lng ?? p.longitude ?? p.pickup_lng;

                if (lat === undefined || lng === undefined) {
                    console.error("Invalid pickup coordinates:", p);
                    return;
                }

                const m = L.marker([lat, lng], { icon: iconToUse })
                    .addTo(map)
                    .bindPopup(
                        (p.is_temp ? "🟡 TEMP PICKUP: " : "📍 PICKUP: ") + p.name
                    );

                pickupMarkers.push(m);
            });

        })
        .catch(err => console.error("Pickup load failed:", err));
}




/* ================= ROUTE ================= */
function drawRoute(lat, lng) {

    const waypoints = [
        L.latLng(lat, lng),
        ...pickupsCache
    .map(p => {
        const lat = p.lat ?? p.latitude ?? p.pickup_lat;
        const lng = p.lng ?? p.longitude ?? p.pickup_lng;
        return (lat && lng) ? L.latLng(lat, lng) : null;
    })
    .filter(Boolean),

        L.latLng(destinationLat, destinationLng)
    ];

    if (routeControl) {
        map.removeControl(routeControl);
    }

    routeControl = L.Routing.control({
        waypoints,
        addWaypoints: false,
        draggableWaypoints: false,
        show: false,
        lineOptions: {
            styles: [{ color: "#38bdf8", weight: 5 }]
        }
    })
    .on("routesfound", e => {
        const route = e.routes[0];

        const minutes = Math.ceil(route.summary.totalTime / 60);
        const km = (route.summary.totalDistance / 1000).toFixed(2);

        document.getElementById("driverETA").innerText = minutes;
        document.getElementById("driverDistance").innerText = km + " km";

        // optional backend sync
        fetch("/driver/update_eta", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ eta: minutes })
        });
    })
    .addTo(map);
}


/* ================= SPEED ================= */
let lastPos = null;
let lastTime = null;

function calculateSpeed(lat, lng) {

    if (!lastPos) {
        lastPos = { lat, lng };
        lastTime = Date.now();
        return 0;
    }

    const R = 6371;
    const dLat = (lat - lastPos.lat) * Math.PI / 180;
    const dLng = (lng - lastPos.lng) * Math.PI / 180;

    const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(lastPos.lat * Math.PI / 180) *
        Math.cos(lat * Math.PI / 180) *
        Math.sin(dLng / 2) ** 2;

    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    const dist = R * c;

    const now = Date.now();
    const hours = (now - lastTime) / 3600000;

    lastPos = { lat, lng };
    lastTime = now;

    return hours > 0 ? (dist / hours).toFixed(1) : 0;
}

/* ================= GPS ================= */
function startTracking() {

    if (tracking) return;
    tracking = true;

    if (!navigator.geolocation) {
        alert("GPS not supported");
        return;
    }

    loadPickups();

    watchId = navigator.geolocation.watchPosition(
        pos => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;

            fetch("/driver/update_location", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    latitude: lat,
                    longitude: lng
                })
            });

            driverMarker.setLatLng([lat, lng]);

            if (!mapCentered) {
                map.setView([lat, lng], 16);
                mapCentered = true;
            }

            document.getElementById("driverSpeed").innerText =
                calculateSpeed(lat, lng);

            if (
                lastRouteLat === null ||
                Math.abs(lat - lastRouteLat) > 0.005 ||
                Math.abs(lng - lastRouteLng) > 0.005
            ) {
                drawRoute(lat, lng);
                lastRouteLat = lat;
                lastRouteLng = lng;
            }
        },
        err => alert(err.message),
        { enableHighAccuracy: true }
    );
}

function stopTracking() {
    if (watchId) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        tracking = false;
        alert("Tracking stopped");
    }
}

</script>
<script>
function sendSOS() {

    if (!confirm("Send SOS alert to admin?")) return;

    if (!navigator.geolocation) {
        alert("GPS not supported");
        return;
    }

    navigator.geolocation.getCurrentPosition(
        pos => {
            fetch("/driver/sos", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    latitude: pos.coords.latitude,
                    longitude: pos.coords.longitude
                })
            })
            .then(r => r.json())
            .then(d => {
                if (d.status === "ok") {
                    alert("🚨 SOS sent successfully");
                } else {
                    alert("❌ SOS failed");
                }
            })
            .catch(() => alert("❌ Network error"));
        },
        () => alert("❌ GPS permission denied")
    );
}
</script>
<script>
function loadPickupOrder() {
    fetch("/driver/ordered_pickups")
        .then(r => r.json())
        .then(data => {

            const ul = document.getElementById("pickupList");
            if (!ul) return;

            ul.innerHTML = "";

            if (data.length === 0) {
                ul.innerHTML = `
                    <li style="color:#94a3b8;padding:10px;">
                        No pickups assigned yet
                    </li>
                `;
                return;
            }

            data.forEach(p => {

                let statusColor = "#facc15"; // Pending
                if (p.status === "Approaching") statusColor = "#38bdf8";
                if (p.status === "Reached") statusColor = "#22c55e";

                const isTemp = p.is_temp === true;
                const bgColor = isTemp ? "#422006" : "#020617";
                const borderColor = isTemp ? "#facc15" : statusColor;
                const tempBadge = isTemp
                    ? "<span style='color:#facc15;font-weight:bold;margin-left:6px;'>(TEMP)</span>"
                    : "";

                ul.innerHTML += `
                  <li style="
                    margin-bottom:10px;
                    padding:12px;
                    border-radius:10px;
                    background:${bgColor};
                    border-left:6px solid ${borderColor};
                  ">
                    <b>${p.name}${tempBadge}</b><br>
                    ${p.distance} m —
                    <span style="color:${statusColor};font-weight:bold;">
                      ${p.status}
                    </span>
                  </li>
                `;
            });
        })
        .catch(err => console.error("Pickup order error:", err));
}
loadPickupOrder();
setInterval(loadPickupOrder, 5000);


</script>







</body>
</html>
