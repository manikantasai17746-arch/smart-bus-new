<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Driver Live GPS</title>

    <!-- Leaflet -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css">

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #0b1c2d;
            color: white;
            font-family: Arial;
        }
        #info {
            margin-bottom: 10px;
            font-size: 16px;
        }
        #map {
            height: 520px;
            border-radius: 10px;
        }
        button {
            padding: 8px 14px;
            margin-right: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h2>🚍 Driver Live GPS</h2>

<div id="info">
    🚗 Speed: <b><span id="speed">0</span> km/h</b> |
    ⏱ ETA: <b><span id="eta">--</span> min</b> |
    📏 Distance: <b><span id="distance">--</span> km</b>
</div>

<button onclick="startTracking()">▶ Start Tracking</button>
<button onclick="stopTracking()">⏸ Stop</button>

<div id="map"></div>

<script>
/* ================= MAP ================= */
const map = L.map("map").setView([17.385, 78.4867], 14);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19
}).addTo(map);

/* ================= ICONS ================= */
const driverIcon = L.icon({
    iconUrl: "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png",
    shadowUrl: "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png",
    iconSize: [25, 41],
    iconAnchor: [12, 41]
});

const pickupIcon = L.icon({
    iconUrl: "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-blue.png",
    shadowUrl: "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png",
    iconSize: [25, 41],
    iconAnchor: [12, 41]
});

const destinationIcon = L.icon({
    iconUrl: "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png",
    shadowUrl: "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png",
    iconSize: [25, 41],
    iconAnchor: [12, 41]
});

/* ================= MARKERS ================= */
const driverMarker = L.marker([0,0], { icon: driverIcon })
    .addTo(map)
    .bindPopup("🚌 Driver");

const destinationLat = 17.089148;
const destinationLng = 82.06599;

L.marker([destinationLat, destinationLng], { icon: destinationIcon })
    .addTo(map)
    .bindPopup("🎓 College");

let pickupMarkers = [];
let routeLine = null;
let fullRoute = [];
let remainingRoute = [];

/* ================= LOAD PICKUPS ================= */
async function loadPickups() {
    const res = await fetch("/driver/get_pickups");
    const pickups = await res.json();

    pickupMarkers.forEach(m => map.removeLayer(m));
    pickupMarkers = [];

    pickups.forEach(p => {
        const m = L.marker([p.lat, p.lng], { icon: pickupIcon })
            .addTo(map)
            .bindPopup("📍 " + p.name);
        pickupMarkers.push(m);
    });
}

/* ================= SPEED ================= */
let lastPos = null;
let lastTime = null;

function calcSpeed(lat, lng) {
    if (!lastPos) {
        lastPos = { lat, lng };
        lastTime = Date.now();
        return 0;
    }

    const R = 6371;
    const dLat = (lat - lastPos.lat) * Math.PI / 180;
    const dLng = (lng - lastPos.lng) * Math.PI / 180;

    const a =
        Math.sin(dLat/2)**2 +
        Math.cos(lastPos.lat*Math.PI/180) *
        Math.cos(lat*Math.PI/180) *
        Math.sin(dLng/2)**2;

    const dist = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    const hours = (Date.now() - lastTime) / 3600000;

    lastPos = { lat, lng };
    lastTime = Date.now();

    return hours > 0 ? (dist / hours).toFixed(1) : 0;
}

/* ================= BUILD ROUTE ONCE ================= */
async function buildRoute(startLat, startLng) {
    const res = await fetch("/driver/get_route_data");
    const data = await res.json();

    const waypoints = [
        L.latLng(startLat, startLng),
        ...data.pickups.map(p => L.latLng(p.lat, p.lng)),
        L.latLng(data.destination.lat, data.destination.lng)
    ];

    const control = L.Routing.control({
        waypoints,
        addWaypoints: false,
        draggableWaypoints: false,
        show: false,
        router: L.Routing.osrmv1({
            serviceUrl: "https://router.project-osrm.org/route/v1"
        })
    });

    control.on("routesfound", e => {
        const route = e.routes[0];

        fullRoute = route.coordinates;
        remainingRoute = [...fullRoute];

        if (routeLine) map.removeLayer(routeLine);
        routeLine = L.polyline(remainingRoute, {
            color: "blue",
            weight: 5
        }).addTo(map);

        const km = (route.summary.totalDistance / 1000).toFixed(2);
        const min = Math.ceil(route.summary.totalTime / 60);

        document.getElementById("distance").innerText = km;
        document.getElementById("eta").innerText = min;

        updateBackend(startLat, startLng, km, min);
    });

    control.addTo(map);
}

/* ================= SHRINK ROUTE ================= */
function shrinkRoute(lat, lng) {
    if (!remainingRoute.length) return;

    let minIdx = 0;
    let minDist = Infinity;

    remainingRoute.forEach((p, i) => {
        const d = Math.hypot(p.lat - lat, p.lng - lng);
        if (d < minDist) {
            minDist = d;
            minIdx = i;
        }
    });

    remainingRoute = remainingRoute.slice(minIdx);
    routeLine.setLatLngs(remainingRoute);
}

/* ================= BACKEND UPDATE ================= */
function updateBackend(lat, lng, dist, eta) {
    fetch("/driver/update_location", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            lat: lat,
            lng: lng,
            distance: dist,
            eta: eta
        })
    });
}

/* ================= GPS ================= */
let watchId = null;

function startTracking() {
    if (!navigator.geolocation) {
        alert("GPS not supported");
        return;
    }

    loadPickups();

    watchId = navigator.geolocation.watchPosition(
        pos => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;

            driverMarker.setLatLng([lat, lng]);
            map.setView([lat, lng], 16, { animate: true });

            document.getElementById("speed").innerText =
                calcSpeed(lat, lng);

            if (!fullRoute.length) {
                buildRoute(lat, lng);
            } else {
                shrinkRoute(lat, lng);
                updateBackend(
                    lat,
                    lng,
                    document.getElementById("distance").innerText,
                    document.getElementById("eta").innerText
                );
            }
        },
        err => alert(err.message),
        { enableHighAccuracy: true }
    );
}

function stopTracking() {
    if (watchId) navigator.geolocation.clearWatch(watchId);
    alert("Tracking stopped");
}
</script>

</body>
</html>
