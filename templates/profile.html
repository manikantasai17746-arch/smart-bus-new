<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Account</title>

<link rel="stylesheet" href="{{ url_for('static', filename='menu.css') }}">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

<style>
body {
    background: #020617;
    color: #e5e7eb;
}

/* Sidebar spacing */
.page-content {
    margin-left: 70px;
    padding: 30px;
    transition: margin-left 0.3s ease;
}
body.menu-open .page-content {
    margin-left: 220px;
}

/* Wrapper */
.profile-wrapper {
    max-width: 900px;
    margin: auto;
}

/* Card */
.card {
    background: #020617;
    border-radius: 18px;
    padding: 28px;
    box-shadow:
        0 0 0 1px rgba(255,255,255,0.05),
        0 10px 30px rgba(0,0,0,0.6);
    position: relative;
}

/* Green glow */
.card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 18px;
    pointer-events: none;
    box-shadow:
        0 0 0 1px rgba(34,197,94,0.35),
        0 0 35px rgba(34,197,94,0.2);
}

/* Header */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.role-badge {
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(34,197,94,0.15);
    color: #22c55e;
    font-size: 13px;
    font-weight: 600;
}

/* Layout */
.profile-grid {
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 30px;
    margin-top: 20px;
}

/* Avatar */
.avatar-box {
    text-align: center;
}
.avatar-box img {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    object-fit: cover;
    box-shadow: 0 0 0 3px rgba(34,197,94,0.7);
}
.avatar-box label {
    display: inline-block;
    margin-top: 12px;
    padding: 8px 14px;
    border-radius: 999px;
    background: rgba(34,197,94,0.15);
    color: #22c55e;
    cursor: pointer;
    font-size: 14px;
}

/* Tabs */
.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}
.tab {
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
    background: rgba(255,255,255,0.06);
    font-size: 14px;
}
.tab.active {
    background: #22c55e;
    color: #020617;
    font-weight: 600;
}

/* Form */
.form-group {
    margin-bottom: 16px;
}
label {
    display: block;
    margin-bottom: 6px;
    color: #94a3b8;
    font-size: 14px;
}
input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: #020617;
    color: white;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
}
input:focus {
    outline: none;
    box-shadow:
        inset 0 0 0 1px rgba(34,197,94,0.9),
        0 0 0 3px rgba(34,197,94,0.25);
}

/* Password tools */
.password-tools {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    margin-top: 6px;
}
.toggle {
    cursor: pointer;
    color: #38bdf8;
}

/* Strength bar */
.strength {
    height: 6px;
    border-radius: 999px;
    background: #1f2933;
    overflow: hidden;
}
.strength span {
    display: block;
    height: 100%;
    width: 0%;
    transition: width 0.3s;
}

/* Buttons */
.btn {
    margin-top: 10px;
    padding: 12px 18px;
    border-radius: 12px;
    border: none;
    font-weight: 600;
    cursor: pointer;
}
.btn-primary {
    background: linear-gradient(135deg, #22c55e, #16a34a);
    color: #020617;
}

/* Mobile */
@media (max-width: 768px) {
    .profile-grid {
        grid-template-columns: 1fr;
        text-align: center;
    }
}
</style>
</head>

<body>

{% include "navbar.html" %}

<div class="page-content">
<div class="profile-wrapper">
<div class="card">

<div class="header">
    <h2 style="margin:0;color:#22c55e;">👤 My Account</h2>
    <div class="role-badge">{{ session.get("role")|capitalize }}</div>
</div>

<form method="POST" enctype="multipart/form-data">
<div class="profile-grid">

<!-- LEFT -->
<div class="avatar-box">
    <img id="avatarPreview"
         src="{{ url_for('static', filename='uploads/' + user['photo']) }}">
    <label>
        Change Photo
        <input type="file" name="photo" hidden onchange="previewPhoto(event)">
    </label>
</div>

<!-- RIGHT -->
<div>
<div class="tabs">
    <div class="tab active" onclick="switchTab('profile')">Profile</div>
    <div class="tab" onclick="switchTab('security')">Security</div>
</div>

<!-- PROFILE -->
<div id="profileTab">
    <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" value="{{ user['username'] }}" required>
    </div>
    <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" value="{{ user['email'] }}" required>
    </div>
</div>

<!-- SECURITY -->
<div id="securityTab" style="display:none;">
    <div class="form-group">
        <label>Current Password</label>
        <input type="password" id="currentPass" name="current_password" required>
        <div class="password-tools">
            <span class="toggle" onclick="togglePass('currentPass')">👁 Show</span>
        </div>
    </div>

    <div class="form-group">
        <label>New Password (optional)</label>
        <input type="password" id="newPass" name="new_password" oninput="checkStrength()">
        <div class="strength"><span id="strengthBar"></span></div>
    </div>
</div>

<button class="btn btn-primary">✅ Update Profile</button>

</div>
</div>
</form>

</div>
</div>
</div>

<script>
let dirty = false;
document.querySelectorAll("input").forEach(i => {
    i.addEventListener("input", () => dirty = true);
});
window.addEventListener("beforeunload", e => {
    if (dirty) {
        e.preventDefault();
        e.returnValue = "";
    }
});


function previewPhoto(event) {
    const file = event.target.files[0];
    if (!file) return;

    const maxSize = 1 * 1024 * 1024; // 1 MB

    if (file.size > maxSize) {
        alert("❌ Image too large. Maximum allowed size is 1 MB.");
        event.target.value = ""; // reset file input
        return;
    }

    document.getElementById("avatarPreview").src =
        URL.createObjectURL(file);
}



function togglePass(id) {
    const f = document.getElementById(id);
    f.type = f.type === "password" ? "text" : "password";
}

function checkStrength() {
    const v = document.getElementById("newPass").value;
    const bar = document.getElementById("strengthBar");
    let s = 0;
    if (v.length >= 8) s += 30;
    if (/[A-Z]/.test(v)) s += 30;
    if (/\d/.test(v)) s += 20;
    if (/[^A-Za-z0-9]/.test(v)) s += 20;
    bar.style.width = s + "%";
    bar.style.background = s < 40 ? "#f87171" : s < 70 ? "#facc15" : "#22c55e";
}

function switchTab(t) {
    document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
    event.target.classList.add("active");
    document.getElementById("profileTab").style.display = t === "profile" ? "block" : "none";
    document.getElementById("securityTab").style.display = t === "security" ? "block" : "none";
}
</script>

</body>
</html>
