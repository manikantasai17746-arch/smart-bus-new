{% extends "base.html" %}

{% block title %}Add New Bus{% endblock %}

{% block content %}
<div class="glass-page">

    <div class="glass-card">

        <div class="glass-header">
            <div class="icon-circle">
                <span class="material-symbols-outlined">directions_bus</span>
            </div>
            <h2>Add New Bus</h2>
            <p style="opacity:0.7;">Register a bus and assign route details</p>
        </div>

        <form method="POST">

            <!-- BUS INFORMATION -->
            <div class="glass-section">
                <span class="section-title blue">BUS INFORMATION</span>

                <input
                    type="text"
                    name="bus_number"
                    placeholder="Bus Number (e.g. TS09 AB 1234)"
                    required
                >

                <input
                    type="text"
                    name="registration_number"
                    placeholder="Registration Number"
                    required
                >
            </div>

            <!-- ROUTE DETAILS -->
            <div class="glass-section">
                <span class="section-title green">ROUTE DETAILS</span>

                <input
                    type="text"
                    name="route"
                    placeholder="Route (e.g. College – City)"
                    required
                >

                <input
                    type="text"
                    name="driver_name"
                    placeholder="Assigned Driver Name"
                >
            </div>

            <button type="submit" class="neon-btn">
                Create Bus
            </button>

        </form>

    </div>

</div>
{% endblock %}
