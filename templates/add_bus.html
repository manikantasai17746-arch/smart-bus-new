{% extends "base.html" %}
{% block title %}Add New Bus{% endblock %}

{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

<style>
/* ===== PAGE ===== */
.glass-page {
    display: flex;
    justify-content: center;
    padding: 40px 20px;
}

.glass-card {
    width: 100%;
    max-width: 540px;
    background: linear-gradient(145deg, #020617, #0f172a);
    border-radius: 22px;
    padding: 30px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.5);
    border: 1px solid #1e293b;
}

/* ===== HEADER ===== */
.glass-header {
    text-align: center;
    margin-bottom: 30px;
}

.icon-circle {
    width: 70px;
    height: 70px;
    margin: auto;
    border-radius: 50%;
    background: linear-gradient(135deg, #38bdf8, #22c55e);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #020617;
    font-size: 34px;
    margin-bottom: 14px;
}

.glass-header h2 {
    margin: 0;
    font-size: 26px;
    background: linear-gradient(90deg, #38bdf8, #22c55e);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
}

.glass-header p {
    margin-top: 6px;
    font-size: 14px;
    color: #94a3b8;
}

/* ===== SECTIONS ===== */
.glass-section {
    background: #020617;
    padding: 18px;
    border-radius: 16px;
    margin-bottom: 20px;
    border: 1px solid #1e293b;
}

.section-title {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.8px;
    margin-bottom: 14px;
}

.section-title.blue { color: #38bdf8; }
.section-title.green { color: #22c55e; }

/* ===== INPUTS ===== */
input {
    width: 100%;
    background: #0f172a;
    border: 1px solid #1e293b;
    color: #e5e7eb;
    padding: 13px 15px;
    border-radius: 14px;
    margin-bottom: 14px;
    font-size: 14px;
}

input::placeholder {
    color: #64748b;
}

input:focus {
    outline: none;
    border-color: #38bdf8;
    box-shadow: 0 0 0 1px rgba(56,189,248,0.4);
}

/* ===== BUTTON ===== */
.neon-btn {
    width: 100%;
    margin-top: 6px;
    background: linear-gradient(135deg, #38bdf8, #22c55e);
    border: none;
    padding: 15px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 700;
    color: #020617;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.neon-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 36px rgba(34,197,94,0.35);
}
</style>

<div class="glass-page">
    <div class="glass-card">

        <!-- HEADER -->
        <div class="glass-header">
            <div class="icon-circle">
                <span class="material-symbols-outlined">directions_bus</span>
            </div>
            <h2>Add New Bus</h2>
            <p>Register bus and configure route details</p>
        </div>

        <form method="POST">

            <!-- BUS INFORMATION -->
            <div class="glass-section">
                <span class="section-title blue">BUS INFORMATION</span>

                <input
                    type="text"
                    name="bus_number"
                    placeholder="Bus Number (e.g. TS09 AB 1234)"
                    required
                >

                <input
                    type="text"
                    name="registration_number"
                    placeholder="Registration Number"
                    required
                >
            </div>

            <!-- ROUTE DETAILS -->
            <div class="glass-section">
                <span class="section-title green">ROUTE DETAILS</span>

                <input
                    type="text"
                    name="route"
                    placeholder="Route (e.g. College → City)"
                    required
                >

                <input
                    type="text"
                    name="driver_name"
                    placeholder="Assigned Driver Name (optional)"
                >
            </div>

            <button type="submit" class="neon-btn">
                Create Bus
            </button>

        </form>

    </div>
</div>

{% endblock %}
