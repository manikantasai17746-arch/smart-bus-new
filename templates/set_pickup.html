{% extends "base.html" %}
{% block content %}

<div class="page-content">
    <h2>📍 Select Pickup Point</h2>
    <p class="pickup-subtext">
        Click on the map or use GPS to choose your exact pickup location.
    </p>

    <div class="pickup-layout">

        <!-- ================= FORM CARD ================= -->
        <div class="pickup-card">
            <h3>📝 Pickup Details</h3>

            <form method="POST">

                <label>Pickup Location Name</label>
                <input type="text"
                       name="pickup_name"
                       placeholder="Eg: Main Gate, Hostel"
                       required>

                <label>Latitude</label>
                <input type="text" id="lat" name="latitude" readonly required>

                <label>Longitude</label>
                <input type="text" id="lng" name="longitude" readonly required>

                <!-- GPS BUTTON -->
                <button type="button"
                        onclick="useCurrentLocation()"
                        class="btn-gps">
                    📍 Use My Current Location
                </button>

                <button type="submit" class="save-btn">
                    ✅ Save Pickup Point
                </button>
            </form>

            <div class="hint">
                📌 Tip: Zoom in and tap precisely where you will stand.
            </div>
        </div>

        <!-- ================= MAP CARD ================= -->
        <div class="map-card">
            <div id="map"></div>
        </div>

    </div>
</div>

<!-- ================= STYLES ================= -->
<style>
.pickup-subtext {
    color: #94a3b8;
    margin-bottom: 18px;
    font-size: 14px;
}

/* Layout */
.pickup-layout {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 20px;
}

/* Mobile layout */
@media (max-width: 900px) {
    .pickup-layout {
        grid-template-columns: 1fr;
    }
}

/* Cards */
.pickup-card,
.map-card {
    background: #020617;
    border-radius: 14px;
    padding: 18px;
    box-shadow:
        0 0 0 1px rgba(255,255,255,0.05),
        0 10px 30px rgba(0,0,0,0.6);
}

/* Form */
.pickup-card label {
    font-size: 13px;
    color: #94a3b8;
    margin-bottom: 6px;
    display: block;
}

.pickup-card input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: #020617;
    color: white;
    margin-bottom: 14px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
}

/* GPS Button */
.btn-gps {
    width: 100%;
    padding: 14px;
    margin-bottom: 12px;
    background: linear-gradient(135deg, #22c55e, #16a34a);
    color: #020617;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
}

/* Save Button */
.save-btn {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, #16a34a, #22c55e);
    color: #052e16;
    font-weight: 700;
}

/* Hint */
.hint {
    margin-top: 12px;
    font-size: 13px;
    color: #38bdf8;
}

/* Map */
#map {
    width: 100%;
    height: 60vh;
    min-height: 320px;
    border-radius: 12px;
}

/* Mobile map */
@media (max-width: 768px) {
    #map {
        height: 70vh;
        min-height: 380px;
    }
}
</style>

<!-- ================= LEAFLET ================= -->
<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* ================= MAP INIT ================= */
var map = L.map('map').setView([17.3850, 78.4867], 13);
var pickupMarker = null;

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

/* 🔧 Force resize AFTER layout settles */
window.addEventListener("load", () => {
    map.invalidateSize();
});

/* ================= MAP CLICK ================= */
map.on('click', function(e) {

    if (pickupMarker) {
        pickupMarker.setLatLng(e.latlng);
    } else {
        pickupMarker = L.marker(e.latlng).addTo(map);
    }

    document.getElementById("lat").value = e.latlng.lat;
    document.getElementById("lng").value = e.latlng.lng;
});

/* ================= GPS ================= */
function useCurrentLocation() {

    if (!navigator.geolocation) {
        alert("GPS not supported on this device");
        return;
    }

    navigator.geolocation.getCurrentPosition(
        pos => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;

            if (pickupMarker) {
                pickupMarker.setLatLng([lat, lng]);
            } else {
                pickupMarker = L.marker([lat, lng]).addTo(map);
            }

            map.setView([lat, lng], 16);

            document.getElementById("lat").value = lat;
            document.getElementById("lng").value = lng;
        },
        () => alert("GPS permission denied"),
        { enableHighAccuracy: true }
    );
}
</script>

{% endblock %}
