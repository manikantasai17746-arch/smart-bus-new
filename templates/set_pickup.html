{% extends "base.html" %}
{% block content %}

<h2>📍 Select Pickup Point</h2>

<form method="POST">
    <label>Pickup Location Name</label><br>
    <input type="text" name="pickup_name" required><br><br>

    <label>Latitude</label><br>
    <input type="text" id="lat" name="latitude" readonly required><br><br>

    <label>Longitude</label><br>
    <input type="text" id="lng" name="longitude" readonly required><br><br>

    <div id="map" style="height: 400px;"></div><br>

    <button type="submit">✅ Save Pickup Point</button>
</form>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    var map = L.map('map').setView([17.3850, 78.4867], 13); // default Hyderabad
    var marker;

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    map.on('click', function(e) {
        if (marker) {
            marker.setLatLng(e.latlng);
        } else {
            marker = L.marker(e.latlng).addTo(map);
        }

        document.getElementById("lat").value = e.latlng.lat;
        document.getElementById("lng").value = e.latlng.lng;
    });
</script>

{% endblock %}
